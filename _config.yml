title: LayoutTranslateBench
description: The first public benchmark for document translation that scores layout fidelity and reading order alongside translation quality.
url: "https://lawrenzho-bit.github.io"
baseurl: "/LayoutTranslateBench"
repository: Lawrenzho-bit/LayoutTranslateBench

theme: minima
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

show_downloads: false

exclude:
  - .gitignore
  - LICENSE
  - DATASET_LICENSE
  - pyproject.toml
  - ltbench/
  - ltbench.egg-info/
  - tests/
  - submissions/
  - results/
  - scripts/
  - "**/__pycache__/**"
  - ".github/"
  - "*.log"

include:
  - leaderboard/index.html

# Pages-served assets
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# SEO / GEO
seo:
  type: WebSite
