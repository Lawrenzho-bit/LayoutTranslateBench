name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests + smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check ltbench/ tests/
      - name: Unit tests
        run: pytest -q
      - name: Verify dataset
        run: ltbench verify
      - name: Run identity baseline
        run: ltbench run-baseline
      - name: Score baseline
        run: ltbench score --submission submissions/identity-baseline
      - name: Build leaderboard
        run: ltbench leaderboard
      - name: Upload leaderboard artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard
          path: |
            leaderboard/
            LEADERBOARD.md
            results/
