[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltbench"
version = "0.1.0"
description = "LayoutTranslateBench — benchmark for document translation with layout preservation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LayoutTranslateBench Contributors" }]
keywords = ["benchmark", "translation", "document-ai", "ocr", "layout", "localization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
runners = [
    "httpx>=0.27",
]
visual = [
    "Pillow>=10.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
ltbench = "ltbench.cli:app"

[project.urls]
Homepage = "https://github.com/Lawrenzho-bit/LayoutTranslateBench"
Documentation = "https://github.com/Lawrenzho-bit/LayoutTranslateBench/blob/main/BENCHMARK.md"
Repository = "https://github.com/Lawrenzho-bit/LayoutTranslateBench"
Issues = "https://github.com/Lawrenzho-bit/LayoutTranslateBench/issues"
Leaderboard = "https://lawrenzho-bit.github.io/LayoutTranslateBench/leaderboard/"

[tool.setuptools.packages.find]
include = ["ltbench*"]
exclude = ["tests*", "data*", "submissions*", "results*", "leaderboard*", "docs*", "scripts*"]

[tool.setuptools.package-data]
ltbench = ["leaderboard/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"
